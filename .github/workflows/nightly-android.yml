# Nightly Android check (ticket #39): every night, runs the same Shopper
# journey end-to-end test as the `web end-to-end` PR check (#36), but on an
# Android emulator, against `main`. It is NOT a PR check and must not be added
# to the required checks. On failure it opens (or comments on) a
# `ready-for-agent` bug issue so the orchestrator picks it up.
name: Nightly Android check

on:
  schedule:
    # 03:00 UTC every night. Scheduled runs always use `main`.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      force_failure:
        description: >-
          Make the test fail on purpose, to check that a failure opens an
          issue. Only works on a manual run, never on the nightly schedule.
        type: boolean
        default: false

concurrency:
  group: nightly-android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Forced failure only ever on a manual run that asked for it.
  FORCE_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_failure == true }}

jobs:
  android-e2e:
    name: Android end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - run: flutter pub get

      # Lets the emulator use hardware acceleration on the runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The same test file as the web check; nothing is copied or forked.
      # results.json lists each test's result, used below to name the
      # failing test in the issue.
      - name: Shopper journey on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: flutter test integration_test/shopper_journey_test.dart -d emulator-5554 --reporter expanded --file-reporter json:results.json --dart-define=STAFEED_FORCE_E2E_FAILURE=${{ env.FORCE_FAILURE }}

      # Only failures on `main` (nightly or manual) open a real bug issue;
      # a manual run on another branch just fails. A forced failure opens its
      # own issue on any branch.
      - name: Open or update the bug issue
        if: ${{ failure() && (github.ref == 'refs/heads/main' || env.FORCE_FAILURE == 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Names of failed tests ("loading ..." entries are Flutter's file
          # loading, reported as a test; keep them only if nothing else failed).
          failed=""
          if [ -s results.json ]; then
            failed=$(jq -rs '
              (map(select(.type == "testStart")) | map({key: (.test.id|tostring), value: .test.name}) | from_entries) as $names
              | map(select(.type == "testDone" and (.result == "failure" or .result == "error") and (.hidden | not)))
              | map($names[(.testID|tostring)]) | unique
              | (map(select(startswith("loading ") | not))) as $real
              | (if ($real|length) > 0 then $real else . end) | .[]' results.json || true)
          fi
          if [ -z "$failed" ]; then
            failed="(no test result: the app did not build, or the emulator did not start; see the run log)"
          fi

          if [ "$FORCE_FAILURE" = "true" ]; then
            title="Nightly Android check failed (deliberate test failure)"
            marker="<!-- nightly-android-check:forced -->"
            note=$'This run was started by hand with **force_failure**, to prove that failures open an issue. Nothing is broken; close this issue.\n\n'
            # Assigned to the owner so the orchestrator leaves it alone.
            assignee_args=(-f "assignees[]=${{ github.repository_owner }}")
          else
            title="Nightly Android check failed"
            marker="<!-- nightly-android-check:main -->"
            note=""
            assignee_args=()
          fi

          # One open issue at a time, found by the hidden marker in its body
          # (or by its title): if it is already open, add a comment instead.
          matches=$(MARKER="$marker" TITLE="$title" gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request == null and (((.body // "") | contains(env.MARKER)) or .title == env.TITLE)) | .number')
          existing=$(printf '%s\n' "$matches" | sed -n 1p)

          tests=$(printf '%s\n' "$failed" | sed 's/^/- `/; s/$/`/')
          if [ -n "$existing" ]; then
            body=$(printf 'Failed again on %s.\n\nFailing test:\n%s\n\nRun log: %s' \
              "$(date -u +%Y-%m-%d)" "$tests" "$RUN_URL")
            gh api "repos/$GITHUB_REPOSITORY/issues/$existing/comments" -f body="$body" > /dev/null
            echo "Commented on existing issue #$existing"
          else
            body=$(printf '%s%s\nThe nightly Android check (ticket #39) failed on `%s` (commit %s).\n\nFailing test:\n%s\n\nRun log: %s\n\nThe test is `integration_test/shopper_journey_test.dart`, the same one the `web end-to-end` PR check runs. Fix the app (or the test, if the test is wrong) so it passes on Android. Never weaken or delete the test to get green.' \
              "$note" "$marker" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$tests" "$RUN_URL")
            number=$(gh api "repos/$GITHUB_REPOSITORY/issues" -f title="$title" -f body="$body" \
              -f "labels[]=ready-for-agent" "${assignee_args[@]}" --jq .number)
            echo "Opened issue #$number"
          fi

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-results
          path: results.json
          if-no-files-found: ignore
