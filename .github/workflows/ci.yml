# CI gate (ticket #32, ADR-0003): every PR to main must pass this before it
# can merge. The job name below is the required check name; keep it stable
# (it is recorded in PROJECT_STATUS.md and used by branch protection, #37).
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Pinned to the owner's local Flutter so "passes locally" and
      # "passes in CI" mean the same thing.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - run: flutter --version

      - run: flutter pub get

      - name: dart format
        run: dart format --output=none --set-exit-if-changed .

      # Later steps still run when an earlier one fails, so one CI run
      # reports every problem at once.
      - name: flutter analyze
        if: ${{ !cancelled() }}
        run: flutter analyze

      # Golden (screenshot) tests run in their own check below.
      - name: flutter test
        if: ${{ !cancelled() }}
        run: flutter test --exclude-tags golden

  # Golden check (ticket #35): screens that look different from the saved
  # images in test/goldens/goldens/ fail the build. Required check name:
  # "goldens" (recorded in PROJECT_STATUS.md). After an intended UI change,
  # run the "Update goldens" workflow on the PR branch.
  goldens:
    name: goldens
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      # The goldens draw text with the Roboto and Material Icons fonts
      # that ship with Flutter; make sure they are downloaded.
      - run: flutter precache --universal

      - run: flutter pub get

      - name: flutter test --tags golden
        run: flutter test --tags golden

      # On a mismatch, Flutter writes before/after/diff images. Download
      # them from the run's "Artifacts" section to see what changed.
      - name: upload golden differences
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/**/failures/
          if-no-files-found: ignore
