# CI gate (ticket #32, ADR-0003): every PR to main must pass this before it
# can merge. The job name below is the required check name; keep it stable
# (it is recorded in PROJECT_STATUS.md and used by branch protection, #37).
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Pinned to the owner's local Flutter so "passes locally" and
      # "passes in CI" mean the same thing.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - run: flutter --version

      - run: flutter pub get

      - name: dart format
        run: dart format --output=none --set-exit-if-changed .

      # Later steps still run when an earlier one fails, so one CI run
      # reports every problem at once.
      - name: flutter analyze
        if: ${{ !cancelled() }}
        run: flutter analyze

      - name: flutter test
        if: ${{ !cancelled() }}
        run: flutter test

  # Web end-to-end test (ticket #36): starts the whole app on Fixtures in
  # headless Chrome and acts like a Shopper. The job name below is a required
  # check name; keep it stable (recorded in PROJECT_STATUS.md).
  web-e2e:
    name: web end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - run: flutter pub get

      # The runner image ships Chrome and a matching chromedriver.
      - name: Start chromedriver
        run: |
          "$CHROMEWEBDRIVER/chromedriver" --port=4444 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4444/status > /dev/null && exit 0
            sleep 1
          done
          echo "chromedriver did not start" && exit 1

      - name: Shopper journey in headless Chrome
        run: >
          flutter drive
          --driver=test_driver/integration_test.dart
          --target=integration_test/shopper_journey_test.dart
          -d web-server --browser-name=chrome
          --browser-dimension=430x932 --headless
